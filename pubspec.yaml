name: hostel_app
description: A new Flutter project for Hostel Management.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  carousel_slider: ^4.2.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
